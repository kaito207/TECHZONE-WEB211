
<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thanh toán - TECHZONE</title>
  <meta name="description" content="Đặt hàng tại TECHZONE">
  <link rel="stylesheet" href="./style.css">
</head>
<body data-page="checkout">
  <header id="header"></header>

  <main class="wrap" style="min-height:70vh;padding-top:20px">
    <h1>Thông tin đặt hàng</h1>

    <form class="card stack" id="checkoutForm" style="max-width:650px">
      <label>
        Họ tên
        <input id="name" required>
      </label>

      <label>
        Số điện thoại
        <input id="phone" required pattern="[0-9+ ]{9,15}">
      </label>

      <label>
        Địa chỉ nhận hàng
        <textarea id="address" required></textarea>
      </label>

      <button class="btn" type="submit">Xác nhận đặt hàng</button>
    </form>
  </main>

  <footer class="footer" id="footer"></footer>
  <script src="./app.js"></script>
</body>
</html>
