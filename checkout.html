<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TECHZONE – checkout</title><meta name="description" content="TECHZONE - cửa hàng công nghệ"><link rel="stylesheet" href="css/style.css"></head><body data-page="checkout"><header id="header"></header><main class="wrap" style="min-height:70vh;padding-top:20px"><h1>Thông tin đặt hàng</h1><form class="card stack" id="checkoutForm" style="max-width:650px"><label>Họ tên<input id="name" required></label><label>Số điện thoại<input id="phone" required pattern="[0-9+ ]{9,15}"></label><label>Địa chỉ nhận hàng<textarea id="address" required></textarea></label><button class="btn">Xác nhận đặt hàng</button></form></main><footer class="footer" id="footer"></footer><script src="js/app.js"></script></body></html>
