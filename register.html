
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký tài khoản - TECHZONE</title>

    <meta name="description"
          content="Đăng ký tài khoản TECHZONE để mua sắm điện thoại, laptop và phụ kiện công nghệ.">

    <!-- CSS nằm cùng thư mục với register.html -->
    <link rel="stylesheet" href="./style.css">
</head>

<body data-page="auth" data-auth="register">

    <!-- HEADER -->
    <header id="header"></header>

    <!-- FORM ĐĂNG KÝ -->
    <main class="wrap" style="min-height:70vh; padding-top:30px;">

        <form
            class="card stack"
            id="authForm"
            style="max-width:460px; margin:auto;"
        >
            <h1>Đăng ký tài khoản</h1>

            <!-- HỌ TÊN -->
            <label for="name">
                Họ và tên
                <input
                    id="name"
                    type="text"
                    name="name"
                    placeholder="Nhập họ và tên"
                    autocomplete="name"
                    required
                >
            </label>

            <!-- EMAIL -->
            <label for="email">
                Email
                <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="Nhập địa chỉ email"
                    autocomplete="email"
                    required
                >
            </label>

            <!-- MẬT KHẨU -->
            <label for="password">
                Mật khẩu
                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Nhập mật khẩu ít nhất 6 ký tự"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >
            </label>

            <!-- NÚT ĐĂNG KÝ -->
            <button class="btn" type="submit">
                Tạo tài khoản
            </button>

            <!-- ĐĂNG NHẬP -->
            <p>
                Đã có tài khoản?
                <a href="./login.html">Đăng nhập ngay</a>
            </p>

        </form>

    </main>

    <!-- FOOTER -->
    <footer class="footer" id="footer"></footer>

    <!-- JAVASCRIPT -->
    <script src="./app.js"></script>

</body>
</html>
