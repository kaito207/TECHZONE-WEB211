
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - TECHZONE</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body data-page="auth" data-auth="login">

    <!-- HEADER -->
    <header id="header"></header>

    <!-- FORM ĐĂNG NHẬP -->
    <main class="wrap" style="min-height:70vh; padding-top:30px;">

        <form
            class="card stack"
            id="authForm"
            style="max-width:460px; margin:auto;"
        >
            <h1>Đăng nhập</h1>

            <label for="email">
                Email
                <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="Nhập email của bạn"
                    autocomplete="email"
                    required
                >
            </label>

            <label for="password">
                Mật khẩu
                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Nhập mật khẩu"
                    autocomplete="current-password"
                    minlength="6"
                    required
                >
            </label>

            <button class="btn" type="submit">
                Đăng nhập
            </button>

            <p>
                Chưa có tài khoản?
                <a href="./register.html">Đăng ký ngay</a>
            </p>

        </form>

    </main>

    <!-- FOOTER -->
    <footer class="footer" id="footer"></footer>

    <!-- JAVASCRIPT -->
    <script src="./app.js"></script>

</body>
</html>
